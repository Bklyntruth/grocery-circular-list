<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e1a">
<meta name="description" content="Find local grocery store deals and manage your shopping list">
<title>Grocery Circular List</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,900;1,700;1,900&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Circular List</h1>
  <div class="header-actions">
    <button id="list-btn" class="header-btn" title="My grocery list">
      List <span id="list-badge" hidden>0</span>
    </button>
    <button id="settings-btn" class="header-btn" title="Settings">&#9881;</button>
  </div>
</header>

<main>
  <form id="search">
    <label>
      Zip code or address
      <input id="location" type="text" value="11236" required>
    </label>
    <label>
      Radius (mi)
      <input id="radius" type="number" value="3" min="0.5" max="12" step="0.5">
    </label>
    <button type="submit">Find Stores</button>
  </form>

  <div id="workspace">
    <div id="left-panel">
      <div id="best-store-banner" hidden></div>
      <div id="filter-bar" hidden>
        <input id="filter-input" type="search" placeholder="Filter stores by name…" autocomplete="off">
        <span id="store-count"></span>
      </div>
      <section id="results"></section>
    </div>
    <div id="right-panel">
      <div id="map" hidden></div>
      <section id="circular"></section>
    </div>
  </div>
</main>

<!-- Bottom navigation -->
<nav class="bottom-nav">
  <a href="#" id="nav-stores" class="active" title="Stores">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
    Stores
  </a>
  <a href="#" id="nav-list" title="My List">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/>
      <line x1="3" y1="12" x2="3.01" y2="12"/>
      <line x1="3" y1="18" x2="3.01" y2="18"/>
    </svg>
    My List
  </a>
  <a href="#" id="nav-settings" title="Settings">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Settings
  </a>
</nav>

<!-- ── List panel (full-screen overlay) ───────────────────────── -->
<div id="list-panel" hidden>
  <div class="list-panel-header">
    <button id="list-panel-back">&#8592; Back</button>
    <span class="list-panel-title">My List</span>
    <span id="list-panel-count" class="list-panel-count"></span>
  </div>
  <div class="list-panel-body">
    <div class="list-controls">
      <div class="list-top-row">
        <select id="list-select" title="Switch list"></select>
        <button id="new-list-btn" class="compact-btn">+ New</button>
        <button id="rename-list-btn" class="compact-btn">Rename</button>
      </div>
      <div class="list-action-row">
        <button id="print-list-btn" class="secondary-btn">Print / PDF</button>
        <button id="clear-list-btn" class="secondary-btn">Clear</button>
        <button id="delete-list-btn" class="danger-btn">Delete List</button>
      </div>
    </div>
    <div id="list-body"></div>
  </div>
</div>

<!-- ── Add-item popup (bottom sheet) ──────────────────────────── -->
<div id="add-popup" hidden>
  <div id="add-popup-backdrop"></div>
  <div id="add-popup-sheet">
    <div class="add-popup-drag"></div>
    <div class="add-popup-item">
      <img id="add-popup-img" class="add-popup-thumb" src="" alt="" hidden>
      <div class="add-popup-info">
        <p id="add-popup-name" class="add-popup-name"></p>
        <p id="add-popup-price" class="add-popup-price"></p>
        <p id="add-popup-store" class="add-popup-store"></p>
      </div>
    </div>
    <div class="add-popup-list-label">Adding to: <strong id="add-popup-list-name"></strong></div>
    <div class="add-popup-actions">
      <button id="add-popup-confirm" class="add-popup-confirm-btn">Add to List</button>
      <button id="add-popup-cancel" class="add-popup-cancel-btn">Cancel</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div id="settings-modal" class="modal" hidden>
  <div class="modal-box">
    <h3>Settings</h3>
    <label class="modal-label">
      Gemini API Key
      <input id="gemini-key-input" type="password" placeholder="AIza…" autocomplete="off">
    </label>
    <p class="modal-hint">Free at <a href="https://aistudio.google.com" target="_blank" rel="noopener">aistudio.google.com</a> — used for ShopRite price extraction.</p>
    <div class="modal-actions">
      <button id="save-settings-btn">Save</button>
      <button id="close-settings-btn" class="secondary-btn">Cancel</button>
    </div>
  </div>
</div>

<!-- Shopping mode overlay -->
<div id="shop-mode" hidden>
  <div class="shop-header">
    <button id="shop-exit-btn">&#8592; Exit</button>
    <span id="shop-store-name"></span>
    <span id="shop-progress"></span>
  </div>
  <div id="shop-items"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
